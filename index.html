<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Piper Sandwich VR</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #12141c;
               font: 14px/1.5 system-ui, sans-serif; color: #e6edf3; }
  #status { position: fixed; top: 12px; left: 12px; z-index: 10;
            background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 10px;
            max-width: 70vw; pointer-events: none; }
  #status b { color: #7cc4ff; }
  #hint { position: fixed; bottom: 12px; left: 12px; z-index: 10;
          background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 10px; }
  #hint code { background: #0d1117; padding: 1px 5px; border-radius: 5px; }
  a { color: #7cc4ff; }
</style>
<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="status"><b>🥪 Piper Sandwich VR</b> — loading MuJoCo…</div>
  <div id="hint">Grip = clutch · Trigger = gripper · left/right controller → left/right arm</div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
