[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-sim-recorder"
version = "0.1.0"
description = "WebSocket-server + LeRobot Robot-plugin die VR-episodes uit piper-sandwich-web lokaal opneemt als LeRobot v3-dataset (optioneel push naar de Hugging Face Hub)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "lerobot[dataset]>=0.6.1",
    "websockets>=14",
    "numpy>=1.24",
    "pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
piper-sim-recorder = "piper_sim_recorder.cli:main"

# lerobot ontdekt plugins via distributie-namen die met 'lerobot_robot_' beginnen; dit is de import-naam
# van de Robot-plugin (registreert het robot-type "piper_sim").
[tool.setuptools.packages.find]
include = ["lerobot_robot_piper_sim*", "piper_sim_recorder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
