<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Piper Table AR Calibration</title>
  <link rel="stylesheet" href="./style.css">
  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <h1>Piper table AR</h1>
    <div id="status">Checking WebXR…</div>
    <div id="details"></div>
    <div class="buttons">
      <button id="recalibrate" disabled>Recalibrate</button>
      <button id="clear" disabled>Clear</button>
      <button id="camera">Test headset camera</button>
      <button id="tags" disabled>Start AprilTag detector</button>
    </div>
    <p class="hint">
      Enter AR. Calibration starts automatically: trigger A = origin, B = +X table edge,
      C = second table edge. The blue rectangle is the calibrated physical tabletop.
    </p>
    <p class="hint"><a href="../">Back to Piper Sandwich VR</a></p>
  </div>
  <video id="camera-video" autoplay playsinline muted></video>
  <canvas id="tag-canvas" width="640" height="480"></canvas>
  <script type="module" src="./app.js"></script>
</body>
</html>
